[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-stink-destroyer-alpha-supreme-pro-max-9000"
version = "0.1.0"
description = "AI-powered stock research platform"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2",
    "requests>=2.31",
    "pandas>=2.0",
    "polars>=0.20",
    "duckdb>=0.10",
    "streamlit>=1.35",
    "plotly>=5.20",
    "groq>=0.9",
    "python-dotenv>=1.0",
    "sec-api>=1.0",
    "alpha-vantage>=2.3",
    "fredapi>=0.5",
    "python-jobspy>=1.1",
    "google-play-scraper>=1.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
hyperstink = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "research*", "strategies*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
